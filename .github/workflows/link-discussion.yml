name: link-discussion

on:
  # A merged pull request from a fork only gets a write token under
  # pull_request_target, which the action needs to comment on the discussion.
  # It reads the pull request body and never checks out or runs its code.
  # jactionlint ignore=dangerous-triggers
  pull_request_target:
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  link-discussion:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      discussions: write
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: jdx/link-discussion-action@38e7537b4b00d6b04a08de54c2f38b3001c9cd8d # v0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
